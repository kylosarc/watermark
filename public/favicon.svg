<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="icoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <linearGradient id="icoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <filter id="icoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Favicon Container (App Icon rounded squircle) -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#icoBg)" stroke="#1f2d3a" stroke-width="2.5"/>
  <rect x="12" y="12" width="232" height="232" rx="50" fill="none" stroke="rgba(76,215,246,0.25)" stroke-width="1.5"/>

  <!-- Concentric watermark contours + bold geometric "W" core -->
  <g transform="translate(128, 126)">
    <!-- Outer concentric contour -->
    <path d="M -66,-10 C -66,-48 -36,-78 0,-78 C 36,-78 66,-48 66,-10 C 66,35 34,64 0,82 C -34,64 -66,35 -66,-10 Z" 
          fill="none" stroke="url(#icoGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Mid concentric contour -->
    <path d="M -48,-11 C -48,-38 -26,-60 0,-60 C 26,-60 48,-38 48,-11 C 48,24 24,46 0,60 C -24,46 -48,24 -48,-11 Z" 
          fill="none" stroke="url(#icoGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- High-impact bold geometric "W" core (punchy at 16px to 64px) -->
    <path d="M -40,-6 L -20,44 L 0,8 L 20,44 L 40,-6" 
          fill="none" stroke="url(#icoGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#icoGlow)"/>
    <path d="M -40,-6 L -20,44 L 0,8 L 20,44 L 40,-6" 
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Apex cryptographic anchor beacon -->
    <circle cx="0" cy="-30" r="6" fill="#ffffff" filter="url(#icoGlow)"/>
    <circle cx="0" cy="-30" r="2.5" fill="#003640"/>

    <!-- Top right authentication badge pip -->
    <circle cx="56" cy="-56" r="7" fill="#4edea3" filter="url(#icoGlow)"/>
  </g>
</svg>