<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <linearGradient id="wCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18222d"/>
      <stop offset="100%" stop-color="#0d1217"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark outer container badge -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0a0e14" stroke="#1c2630" stroke-width="3"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#shieldGrad)" stroke="rgba(76, 215, 246, 0.2)" stroke-width="1.5"/>

  <!-- Subtle forensic grid lattice -->
  <g opacity="0.08" stroke="#4cd7f6" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="472"/>
    <line x1="160" y1="40" x2="160" y2="472"/>
    <line x1="256" y1="40" x2="256" y2="472"/>
    <line x1="352" y1="40" x2="352" y2="472"/>
    <line x1="432" y1="40" x2="432" y2="472"/>
    <line x1="40" y1="80" x2="472" y2="80"/>
    <line x1="40" y1="160" x2="472" y2="160"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
    <line x1="40" y1="352" x2="472" y2="352"/>
    <line x1="40" y1="432" x2="472" y2="432"/>
  </g>

  <!-- Ambient glow aura -->
  <circle cx="256" cy="232" r="140" fill="#06b6d4" opacity="0.16" filter="url(#glowEffect)"/>

  <!-- C2PA Security & Provenance Glyph: Concentric Watermark Waves + Incorporated Geometric "W" -->
  <g transform="translate(256, 226)">
    <!-- Outer hexagonal / faceted boundary ticks -->
    <circle cx="0" cy="0" r="162" fill="none" stroke="rgba(78, 222, 163, 0.25)" stroke-width="2" stroke-dasharray="8 12"/>
    <circle cx="0" cy="0" r="146" fill="none" stroke="rgba(76, 215, 246, 0.4)" stroke-width="2"/>
    
    <!-- Target crosshairs / alignment ticks -->
    <line x1="-172" y1="0" x2="-152" y2="0" stroke="#4cd7f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="152" y1="0" x2="172" y2="0" stroke="#4cd7f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-172" x2="0" y2="-152" stroke="#4cd7f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="152" x2="0" y2="172" stroke="#4edea3" stroke-width="3" stroke-linecap="round"/>

    <!-- Concentric Watermark Waves / Fingerprint Ridge Flow -->
    <!-- Ridge 5 (Outermost droplet loop) -->
    <path d="M -110,-10 C -110,-72 -62,-120 0,-120 C 62,-120 110,-72 110,-10 C 110,65 55,116 0,140 C -55,116 -110,65 -110,-10 Z" 
          fill="none" stroke="url(#primaryGlow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>

    <!-- Ridge 4 -->
    <path d="M -86,-12 C -86,-60 -48,-98 0,-98 C 48,-98 86,-60 86,-12 C 86,48 44,88 0,110 C -44,88 -86,48 -86,-12 Z" 
          fill="none" stroke="url(#primaryGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- Ridge 3 (Mid loop) -->
    <path d="M -62,-14 C -62,-48 -35,-76 0,-76 C 35,-76 62,-48 62,-14 C 62,32 30,62 0,80 C -30,62 -62,32 -62,-14 Z" 
          fill="none" stroke="url(#primaryGlow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" filter="url(#glowEffect)"/>

    <!-- Embedded Precision Geometric "W" Monogram (Integrated seamlessly into the center core) -->
    <path d="M -54,-14 L -27,48 L 0,0 L 27,48 L 54,-14" 
          fill="none" stroke="url(#primaryGlow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#coreGlow)"/>
    <path d="M -54,-14 L -27,48 L 0,0 L 27,48 L 54,-14" 
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Apex cryptographic anchor beacon / seed node -->
    <circle cx="0" cy="-44" r="10" fill="#ffffff" filter="url(#glowEffect)"/>
    <circle cx="0" cy="-44" r="4.5" fill="#003640"/>

    <!-- Bottom provenance verification node -->
    <circle cx="0" cy="140" r="7" fill="#4edea3" filter="url(#glowEffect)"/>
    <circle cx="0" cy="140" r="3" fill="#0a0e14"/>
  </g>

  <!-- Monospace typography lockup -->
  <text x="256" y="434" font-family="'JetBrains Mono', 'Geist', monospace" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="10" text-anchor="middle">WATERMARK</text>
  <text x="256" y="458" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#4cd7f6" letter-spacing="3" text-anchor="middle" opacity="0.9">C2PA PROVENANCE &amp; FORENSIC SUITE</text>
</svg>