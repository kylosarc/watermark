<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4cd7f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4cd7f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#0d1117"/>
  
  <!-- Concentric circles -->
  <circle cx="100" cy="100" r="85" stroke="#4cd7f6" stroke-width="0.5" fill="none" opacity="0.15"/>
  <circle cx="100" cy="100" r="70" stroke="#4cd7f6" stroke-width="0.8" fill="none" opacity="0.2"/>
  <circle cx="100" cy="100" r="55" stroke="#4cd7f6" stroke-width="1" fill="none" opacity="0.25"/>
  <circle cx="100" cy="100" r="40" stroke="#4cd7f6" stroke-width="1.2" fill="none" opacity="0.3"/>
  
  <!-- Target lines -->
  <line x1="100" y1="10" x2="100" y2="30" stroke="#4cd7f6" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="170" x2="100" y2="190" stroke="#4cd7f6" stroke-width="1" opacity="0.4"/>
  <line x1="10" y1="100" x2="30" y2="100" stroke="#4cd7f6" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="100" x2="190" y2="100" stroke="#4cd7f6" stroke-width="1" opacity="0.4"/>
  
  <!-- Center glow -->
  <circle cx="100" cy="100" r="30" fill="url(#centerGlow)"/>
  
  <!-- W letter with glow -->
  <g filter="url(#glow)">
    <path d="M55 65 L75 135 L100 95 L125 135 L145 65" 
          stroke="url(#glowGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="100" cy="50" r="4" fill="#4cd7f6"/>
  <circle cx="100" cy="50" r="8" stroke="#4cd7f6" stroke-width="0.5" fill="none" opacity="0.5"/>
</svg>
