<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="50%" stop-color="#d0bcff"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M40 8 L68 22 L68 46 C68 60 56 72 40 76 C24 72 12 60 12 46 L12 22 Z"
        fill="url(#shieldGrad)" opacity="0.15" stroke="url(#shieldGrad)" stroke-width="2"/>
  <!-- Checkmark -->
  <path d="M28 44 L36 52 L54 30" stroke="url(#shieldGrad)" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Watermark text -->
  <text x="82" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="38"
        font-weight="700" letter-spacing="-1" fill="url(#textGrad)">watermark</text>
  <!-- C2PA badge -->
  <rect x="82" y="58" width="48" height="16" rx="4" fill="url(#shieldGrad)" opacity="0.2"/>
  <text x="106" y="70" font-family="'JetBrains Mono', monospace" font-size="9"
        font-weight="600" fill="#4cd7f6" text-anchor="middle" letter-spacing="0.5">C2PA</text>
</svg>
